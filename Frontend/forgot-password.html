<!DOCTYPE html>
<html>

<head>
  <title>Reset Password | HeartAI</title>

  <script>
    const token = localStorage.getItem("token");
    if (token) {
      window.location.href = "index.html";
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .card {
      width: 420px;
      padding: 40px 36px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
    }

    .section {
      margin-bottom: 18px;
    }

    input {
      width: 93%;
      height: 52px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: white;
      outline: none;
      font-size: 14px;
    }

    button {
      height: 48px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(to right, #3b82f6, #6366f1);
      color: white;
      margin-top: 16px;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    .btn-row {
      display: flex;
      margin-top: 16px;
      gap: 16px;
    }

    .btn-row button {
      flex: 1;
    }

    #msg {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      min-height: 20px;
      transition: opacity 0.3s ease;
    }

    .link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }

    .link span {
      color: #3b82f6;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>Reset Password</h2>

    <div class="section">
      <input type="email" id="email" placeholder="Enter your email">
    </div>

    <div class="section">
      <input type="password" id="password" placeholder="New password">
    </div>

    <div class="section">
      <input type="text" id="otp" placeholder="Enter OTP">
    </div>

    <div class="btn-row">

      <button class="secondary-btn" onclick="sendOTP(event)">
        Send OTP
      </button>

      <button class="secondary-btn" onclick="verifyOTP(event)">
        Verify OTP
      </button>

    </div>

    <button id="resetBtn" class="primary-btn" onclick="resetPassword()" disabled>
      Reset Password
    </button>

    <p id="msg"></p>

    <div class="link">
      Remember your password?
      <span onclick="goLogin()">Login</span>
    </div>

  </div>

  <script>

    let isVerified = false;

    function showMsg(text, color = "white") {
      const msg = document.getElementById("msg");
      msg.style.opacity = "0";

      setTimeout(() => {
        msg.innerText = text;
        msg.style.color = color;
        msg.style.opacity = "1";
      }, 150);
    }

    // Unpacks FastAPI response payload errors to clean strings
    function parseErrorMessage(data, fallback = "An error occurred") {
      if (Array.isArray(data.detail)) {
        return data.detail[0].msg;
      }
      if (typeof data.detail === "string") {
        return data.detail;
      }
      return fallback;
    }

    // Ensures client-side validation matches Pydantic requirements
    function isValidPassword(password) {
      const minLength = password.length >= 8;
      const hasDigit = /\d/.test(password);
      const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);
      return minLength && hasDigit && hasSpecialChar;
    }


    /* SEND RESET OTP */

    async function sendOTP(event) {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMsg("Enter email ❌", "red");
        return;
      }

      try {
        const res = await fetch("http://127.0.0.1:8000/auth/send-reset-otp", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email: email })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(parseErrorMessage(data, "Failed to send OTP"));
        }

        showMsg("OTP sent 📩", "#22c55e");

      } catch (err) {
        showMsg(err.message, "red");
      }
    }


    /* VERIFY OTP */

    async function verifyOTP(event) {
      const email = document.getElementById("email").value.trim();
      const otp = document.getElementById("otp").value.trim();

      if (!email || !otp) {
        showMsg("Enter email and OTP ❌", "red");
        return;
      }

      try {
        const res = await fetch("http://127.0.0.1:8000/auth/verify-otp", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, otp })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(parseErrorMessage(data, "Invalid OTP"));
        }

        isVerified = true;
        document.getElementById("resetBtn").disabled = false;
        showMsg("OTP Verified ✅", "#22c55e");

      } catch (err) {
        isVerified = false;
        document.getElementById("resetBtn").disabled = true;
        showMsg(err.message, "red");
      }
    }


    /* RESET PASSWORD */

    async function resetPassword() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!isVerified) {
        showMsg("Verify OTP first ❌", "red");
        return;
      }

      if (!isValidPassword(password)) {
        showMsg("Password must be 8+ chars, with 1 digit & 1 special char ❌", "red");
        return;
      }

      try {
        const res = await fetch("http://127.0.0.1:8000/auth/reset-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(parseErrorMessage(data, "Password reset failed"));
        }

        showMsg("Password reset completed successfully. Redirecting...", "#22c55e");

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);

      } catch (err) {
        showMsg(err.message, "red");
      }
    }


    function goLogin() {
      window.location.href = "login.html";
    }

  </script>

</body>

</html>
